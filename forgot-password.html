<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Recovery — STACKLY Luxury Watches</title>
  <meta name="description" content="Recover your STACKLY client account credentials.">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="page-auth">

  <!-- Site Header with Brand Logo Top Left & Back to Home Top Right -->
  <header class="site-header" role="banner">
    <div class="container nav-container" style="justify-content: space-between;">
      <a href="index.html" class="nav-logo" aria-label="STACKLY Luxury Watches home">
        <img
          src="./images/logo-dark.webp"
          alt="STACKLY Luxury Watches"
          class="nav-logo-img"
        >
      </a>

      <div class="nav-actions">
        <a href="./index.html" class="btn btn--outline btn--sm" aria-label="Back to Home">
          <span class="material-icons" aria-hidden="true" style="font-size: 16px;">arrow_back</span>
          <span class="btn-text-responsive">Back to Home</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Credential Recovery Card -->
  <main class="auth-wrapper">
    <div class="auth-card glass-panel">
      <div style="text-align: center; margin-bottom: 2rem;">
        <span class="section-eyebrow">Credential Recovery</span>
        <h1 style="font-size: 2.2rem; margin-bottom: 0.5rem;">Reset Password</h1>
        <div class="divider-line"></div>
        <p style="font-size: 0.9rem; color: var(--text-secondary);">Enter the registered email address associated with your STACKLY patron account.</p>
      </div>

      <form id="recovery-form" novalidate>
        <div class="form-group">
          <label for="recovery-email" class="form-label">Email Address *</label>
          <input type="email" id="recovery-email" class="form-input" required placeholder="client@stackly-horology.com">
        </div>

        <button type="submit" id="recovery-submit-btn" class="btn btn--primary" style="width: 100%; margin-top: 1rem;">
          <span>Dispatch Recovery Link</span>
          <span class="material-icons" aria-hidden="true" style="font-size: 1.1rem; margin-left: 0.4rem;">vpn_key</span>
        </button>

        <div id="recovery-status-msg" class="auth-status-message" style="display: none; margin-top: 1rem;"></div>
      </form>

      <div style="text-align: center; margin-top: 2rem; border-top: 1px solid var(--border-gold-subtle); padding-top: 1.5rem; font-size: 0.88rem;">
        <a href="./login.html" style="color: var(--champagne-gold); font-weight: 600; text-decoration: underline;">Return to Sign In</a>
        <br><br>
        <a href="./index.html" style="font-size: 0.82rem; color: var(--accent-muted); display: inline-flex; align-items: center; gap: 0.4rem;">
          <span class="material-icons" aria-hidden="true" style="font-size: 16px;">arrow_back</span>
          <span>Back to Boutique Home</span>
        </a>
      </div>
    </div>
  </main>

  <footer class="site-footer" style="padding: 2rem 0;">
    <div class="container footer-bottom">
      <span>&copy; 2026 STACKLY Horology. Secure client demonstration portal.</span>
      <div style="display: flex; gap: 1.5rem;">
        <a href="./about.html">Privacy Policy</a>
        <a href="./contact.html">Concierge Desk</a>
      </div>
    </div>
  </footer>

  <script src="./js/cart.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/main.js"></script>
  <script>
    document.getElementById('recovery-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const emailInput = document.getElementById('recovery-email');
      const statusMsg = document.getElementById('recovery-status-msg');
      const submitBtn = document.getElementById('recovery-submit-btn');
      const email = emailInput.value.trim();
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      if (!email || !emailRegex.test(email)) {
        statusMsg.className = 'auth-status-message is-error';
        statusMsg.style.display = 'flex';
        statusMsg.innerHTML = '<span class="material-icons" aria-hidden="true">error</span> Please enter a valid registered email address.';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>Processing...</span><span class="material-icons" aria-hidden="true">hourglass_empty</span>';

      setTimeout(() => {
        statusMsg.className = 'auth-status-message is-success';
        statusMsg.style.display = 'flex';
        statusMsg.innerHTML = `<span class="material-icons" aria-hidden="true">check_circle</span> Reset instructions simulated for ${email}. (In production, an automated token is dispatched via your secure SMTP provider).`;
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Link Dispatched</span><span class="material-icons" aria-hidden="true">done</span>';
      }, 500);
    });
  </script>
</body>
</html>
