  <main class="page-404-wrapper">
    <div class="container" style="max-width: 720px; text-align: center; padding: 4rem 1.5rem;">
      
      <!-- Oversized 404 Typography -->
      <div class="error-typography" style="font-family: var(--font-serif); font-size: 7rem; line-height: 1; color: var(--champagne-gold); margin-bottom: 1.5rem; letter-spacing: 0.05em;">404</div>

      <!-- Minimal Watch Dial with CSS Rotating Hands -->
      <div class="error-watch-dial" aria-label="Mechanical Watch Dial with Sweeping Hands" style="margin: 0 auto 2.5rem auto;">
        <!-- 4 Cardinal Dial Markers -->
        <div style="position: absolute; top: 10px; left: 50%; width: 2px; height: 10px; background: var(--champagne-gold); transform: translateX(-50%);"></div>
        <div style="position: absolute; bottom: 10px; left: 50%; width: 2px; height: 10px; background: var(--champagne-gold); transform: translateX(-50%);"></div>
        <div style="position: absolute; top: 50%; left: 10px; width: 10px; height: 2px; background: var(--champagne-gold); transform: translateY(-50%);"></div>
        <div style="position: absolute; top: 50%; right: 10px; width: 10px; height: 2px; background: var(--champagne-gold); transform: translateY(-50%);"></div>
        
        <!-- Center Pinion -->
        <div style="position: absolute; top: 50%; left: 50%; width: 12px; height: 12px; border-radius: 50%; background: var(--champagne-gold); transform: translate(-50%, -50%); z-index: 5;"></div>
        
        <!-- Rotating Hands -->
        <div class="error-hand-hour"></div>
        <div class="error-hand-minute"></div>
      </div>

      <span class="section-eyebrow">Temporal Displacement</span>
